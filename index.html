
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Color World</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7e9;color:#432466;font-family:Arial,sans-serif}
header{text-align:center;color:white;background:linear-gradient(110deg,#7038de,#f25ab7,#ffb64d);padding:28px 10px;border-radius:0 0 30px 30px}
h1{font-size:32px;margin:0}
main{max-width:850px;margin:auto;padding:15px}
h2{text-align:center;font-size:20px}
.gallery{display:flex;gap:10px;overflow-x:auto;padding:10px}
.tile{flex:0 0 115px;background:white;border:3px solid #e6d6ef;border-radius:16px;padding:8px;cursor:pointer;color:#432466;font-weight:bold}
.tile.active{border-color:#853deb}
.tile img{width:90px;height:95px;object-fit:contain}
.board{max-width:560px;margin:auto;background:white;border:5px solid #e5cafa;border-radius:22px;padding:6px}
canvas{display:block;width:100%;touch-action:manipulation}
.palette{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:15px auto}
.swatch{width:43px;height:43px;border-radius:50%;border:2px solid #777;cursor:pointer}
.swatch.active{outline:4px solid #7936d8;outline-offset:2px}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.action{background:#7936d8;color:white;border:0;border-radius:14px;padding:13px 17px;font-size:16px;cursor:pointer}
#status{text-align:center;min-height:24px}
footer{text-align:center;padding:22px;color:#777}
</style>
</head>
<body>
<header>
<h1>🌈 Little Color World</h1>
<p>Pick a picture. Pick a color. Tap to paint!</p>
<strong>100% FREE • NO ADS • NO PURCHASES</strong>
</header>
<main>
<h2>Choose your picture 🎨</h2>
<div id="gallery" class="gallery"></div>
<h2 id="title"></h2>
<div class="board"><canvas id="canvas"></canvas></div>
<p id="status">Choose a picture to begin.</p>
<h2>🖍️ Choose a color</h2>
<div id="palette" class="palette"></div>
<div class="controls">
<button class="action" id="undo">↶ Undo</button>
<button class="action" id="reset">↻ Reset</button>
<button class="action" id="next">Next →</button>
<button class="action" id="save">Save Picture</button>
</div>
</main>
<footer>Little Color World · 25 Coloring Adventures</footer>
<script>
const names=[
["🦁","Lion & Butterfly"],["🐘","Elephant & Frog"],
["🐰","Bunny Garden"],["🐱","Playful Kitten"],
["🐻","Teddy Bear Picnic"],["🐵","Jungle Monkey"],
["🐦","Bird & Treehouse"],["🦋","Butterfly Garden"],
["🦕","Baby Dinosaur"],["🦄","Rainbow Unicorn"],
["🦁","Lion in Savanna"],["🐘","Elephant Splash"],
["🐵","Monkey by Waterfall"],["🐻","Bear & Honey"],
["🐰","Bunny & Butterfly"],["🐱","Kitten & Yarn"],
["🦁","Sunny Lion"],["🐘","Elephant with Scarf"],
["🐵","Monkey on a Branch"],["🐻","Bear Picnic"],
["🐰","Bunny with Bow"],["🐱","Kitten & Butterflies"],
["🐘","Elephant Pond"],["🐦","Birdhouse Adventure"],
["🐾","Animal Friends"]
];
const colors=["#ff4b5c","#ff9437","#ffe348","#80d65c",
"#22c9a8","#42adf5","#7062e8","#a873e9",
"#f48dc4","#ab754c","#f6c7a1","#75dbe2",
"#888888","#222222","#ffffff","#c5eb79"];
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const gallery=document.getElementById("gallery");
const palette=document.getElementById("palette");
const status=document.getElementById("status");
let page=0,color=colors[0],original=null,history=[];
let progress={};
try{progress=JSON.parse(localStorage.getItem("littlecolorworld")||"{}")}catch(e){}
function persist(){
try{localStorage.setItem("littlecolorworld",JSON.stringify(progress))}catch(e){}
}
function filename(n){return "art/page-"+String(n+1).padStart(2,"0")+".png"}
names.forEach((item,i)=>{
let b=document.createElement("button");
b.className="tile";
b.innerHTML='<img src="'+filename(i)+'" alt="">'+
'<div>'+(i+1)+'. '+item[0]+' '+item[1]+'</div>';
b.onclick=()=>load(i);
gallery.appendChild(b);
});
colors.forEach((c,i)=>{
let b=document.createElement("button");
b.className="swatch"+(i===0?" active":"");
b.style.background=c;
b.setAttribute("aria-label","Choose color "+(i+1));
b.onclick=()=>{
color=c;
palette.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
};
palette.appendChild(b);
});
function rgb(hex){
return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
}
function fill(x,y,hex,record=true){
if(!original)return false;
const w=canvas.width,h=canvas.height;
x=Math.floor(x);y=Math.floor(y);
if(x<0||y<0||x>=w||y>=h)return false;
const src=original.data;
let seed=y*w+x;
if(src[seed*4]<225)return false;
const data=ctx.getImageData(0,0,w,h);
const dst=data.data;
const seen=new Uint8Array(w*h);
const queue=new Int32Array(w*h);
let head=0,tail=1;
queue[0]=seed;seen[seed]=1;
const can=p=>src[p*4]>225;
while(head<tail){
const p=queue[head++],cx=p%w,cy=(p/w)|0;
const nearby=[];
if(cx>0)nearby.push(p-1);
if(cx<w-1)nearby.push(p+1);
if(cy>0)nearby.push(p-w);
if(cy<h-1)nearby.push(p+w);
for(const n of nearby)
if(!seen[n]&&can(n)){seen[n]=1;queue[tail++]=n}
}
const [r,g,b]=rgb(hex);
for(let i=0;i<tail;i++){
let j=queue[i]*4;
dst[j]=r;dst[j+1]=g;dst[j+2]=b;dst[j+3]=255;
}
ctx.putImageData(data,0,0);
if(record){
history.push({x,y,hex});
progress[page]=history.slice(-150);
persist();
}
return true;
}
function redraw(){
if(!original)return;
ctx.putImageData(original,0,0);
for(const a of history)fill(a.x,a.y,a.hex,false);
}
function load(i){
page=i;original=null;
document.getElementById("title").textContent=names[i][0]+" "+names[i][1];
gallery.querySelectorAll(".tile").forEach((b,j)=>b.classList.toggle("active",i===j));
status.textContent="Loading picture...";
const img=new Image();
img.onload=()=>{
canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
original=ctx.getImageData(0,0,canvas.width,canvas.height);
history=(progress[page]||[]).slice();
redraw();
status.textContent="Choose a color and tap the picture!";
};
img.onerror=()=>{
canvas.width=400;canvas.height=500;
ctx.fillStyle="white";ctx.fillRect(0,0,400,500);
ctx.fillStyle="#6541a1";ctx.font="20px Arial";
ctx.textAlign="center";
ctx.fillText("Illustration not uploaded yet",200,240);
status.textContent="The picture file needs to be added to the art folder.";
};
img.src=filename(i);
}
canvas.addEventListener("pointerup",e=>{
if(!original)return;
const r=canvas.getBoundingClientRect();
const x=(e.clientX-r.left)*canvas.width/r.width;
const y=(e.clientY-r.top)*canvas.height/r.height;
if(fill(x,y,color))status.textContent="Beautiful! Keep coloring!";
else status.textContent="Tap inside a white outlined area.";
});
document.getElementById("undo").onclick=()=>{
history.pop();progress[page]=history.slice();persist();redraw();
};
document.getElementById("reset").onclick=()=>{
if(!confirm("Start this picture again?"))return;
history=[];progress[page]=[];persist();redraw();
};
document.getElementById("next").onclick=()=>load((page+1)%names.length);
document.getElementById("save").onclick=()=>{
if(!original)return;
let a=document.createElement("a");
a.href=canvas.toDataURL("image/png");
a.download="LittleColorWorld-"+(page+1)+".png";
a.click();
};
load(0);
</script>
</body>
</html>
